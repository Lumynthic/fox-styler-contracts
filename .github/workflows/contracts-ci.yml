name: Fox Styler Contracts CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.7.1

      - name: Install pinned dependencies
        run: ./tools/bootstrap_dependencies.sh

      - name: Static checks
        run: python3 tools/static_checks.py

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Unit and adversarial tests
        run: forge test -vvv

      - name: Fuzz tests
        run: forge test --fuzz-runs 10000
